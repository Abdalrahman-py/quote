<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>بطاقة اقتباس · UCAS IT Club</title>
  <meta name="description" content="احصل على بطاقة اقتباس وشاركها في ستوري Instagram مع منشن @ucas.it.club">
  <meta name="theme-color" content="#0d1726">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/ucas-logo.webp" type="image/webp">
  <link rel="preload" href="fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/cairo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Icons: Lucide (ISC license), same set the club website uses. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
      <symbol id="i-ig" viewBox="0 0 24 24"><rect width="20" height="20" x="2" y="2" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><path d="M17.5 6.5h.01"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    </defs>
  </svg>

  <main>
    <header>
      <img src="assets/ucas-logo.webp" alt="" width="124" height="160">
      <h1>انشرنا على قصتك</h1>
    </header>

    <!-- Five cards in a row: two hidden ones wait beyond each visible side card. Swipe, tap a side card or use the arrow keys. -->
    <figure id="stage" class="stage" tabindex="0" aria-roledescription="carousel" aria-label="بطاقات الاقتباس، اسحب لاقتباس آخر">
      <img class="card loading" width="1080" height="1920" alt="" draggable="false">
      <img class="card loading" width="1080" height="1920" alt="" draggable="false">
      <img class="card loading" width="1080" height="1920" alt="" draggable="false">
      <img class="card loading" width="1080" height="1920" alt="" draggable="false">
      <img class="card loading" width="1080" height="1920" alt="" draggable="false">
      <p class="wait" aria-hidden="true">جارٍ تجهيز البطاقة…</p>
      <p id="status" role="status" aria-live="polite"></p>
    </figure>

    <div class="steps">
      <button id="save" class="step" type="button">
        <svg aria-hidden="true"><use href="#i-save"/></svg>
        <span class="lbl">حفظ</span>
      </button>
      <button id="copy" class="step" type="button">
        <svg aria-hidden="true"><use href="#i-copy"/></svg>
        <span class="lbl">نسخ</span>
      </button>
      <a id="ig" class="step" href="https://www.instagram.com/" data-ig>
        <svg aria-hidden="true"><use href="#i-ig"/></svg>
        <bdi>Instagram</bdi>
      </a>
    </div>


    <button id="how" class="how" type="button">كيف أنشر الستوري؟</button>
  </main>

  <!-- Opens by itself once the image is saved and the text copied. -->
  <dialog id="guide" aria-labelledby="guide-title">
    <h2 id="guide-title">جاهز! انشرها في الستوري</h2>
    <ol>
      <li>افتح Instagram واضغط <b>+</b> ثم اختر <b>قصة</b></li>
      <li>اختر صورة الاقتباس من المعرض</li>
      <li>اضغط <b>Aa</b> والصق النص</li>
      <li>أضف ملصق <b>@</b> واكتب <bdi dir="ltr">ucas.it.club</bdi></li>
      <li>انشرها في <b>قصتك</b></li>
    </ol>
    <a class="step cta" href="https://www.instagram.com/" data-ig>
      <svg aria-hidden="true"><use href="#i-ig"/></svg>
      <bdi>افتح Instagram</bdi>
    </a>
    <button id="guide-close" class="how" type="button">إغلاق</button>
  </dialog>

  <script src="quotes.js"></script>
  <script src="app.js"></script>
</body>
</html>
